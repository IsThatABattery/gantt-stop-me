<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to GanttStopMe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B16}
a{color:#3FD5E8}a:hover{color:#8BE9F4}
.stars{background-image:radial-gradient(1px 1px at 20px 30px,rgba(230,236,247,.22) 50%,transparent 51%),radial-gradient(1px 1px at 140px 90px,rgba(230,236,247,.14) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 260px 20px,rgba(230,236,247,.2) 50%,transparent 51%);background-size:300px 120px}
</style>
</helmet>
<div class="stars" style="min-height: 900px; box-sizing: border-box; padding: 24px; background-color: #070B16; color: #E6ECF7; font-family: Inter, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">

<a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px; color: #E6ECF7; text-decoration: none; min-height: 44px">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3FD5E8" stroke-width="1.6" aria-hidden="true"><g transform="rotate(-25 12 12)"><path d="M1.5 12A10.5 3.4 0 0 1 22.5 12"></path><circle cx="12" cy="12" r="6" fill="#0D1830"></circle><path d="M1.5 12A10.5 3.4 0 0 0 22.5 12"></path></g></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px">GanttStopMe</span>
</a>

<div style="width: 100%; max-width: 420px; box-sizing: border-box; padding: 32px; border-radius: 16px; border: 1px solid #24304A; background: rgba(15,22,38,.95); display: flex; flex-direction: column; gap: 20px">
<div>
<div style="font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: .04em; color: #9AA7BF">FLIGHT DECK ACCESS</div>
<h1 style="margin: 6px 0 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 26px">Sign in</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; border-radius: 10px; border: 1px solid #24304A; background: #0B1120; color: #E6ECF7; font: inherit; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M9 19c-4 1.5-4-2-6-2.5M15 22v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12 12 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V22"></path></svg>
Continue with GitHub</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; border-radius: 10px; border: 1px solid #24304A; background: #0B1120; color: #E6ECF7; font: inherit; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
Continue with SSO</button>
</div>

<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #9AA7BF">
<span style="flex: 1; height: 1px; background: #24304A"></span>or with email<span style="flex: 1; height: 1px; background: #24304A"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 13px; color: #C2CCDD">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@team.dev" style="min-height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #24304A; background: #0B1120; color: #E6ECF7; font: inherit">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="password" style="font-size: 13px; color: #C2CCDD">Password</label>
<a href="#" style="font-size: 13px">Forgot password?</a>
</div>
<input id="password" type="password" autocomplete="current-password" style="min-height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid #24304A; background: #0B1120; color: #E6ECF7; font: inherit">
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: #C2CCDD">
<input type="checkbox" style="width: 18px; height: 18px; accent-color: #3FD5E8">Keep me signed in</label>
</div>

<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; background: #3FD5E8; color: #062029; font-weight: 600; text-decoration: none">Sign in</a>
</div>

<div style="font-size: 14px; color: #9AA7BF">New operator? <a href="#">Request access</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

</body>
</html>
